name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: iashmita97
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2306B6D4&color_dots=%230F172A,%231E3A8A,%230284C7,%2338BDF8,%2322D3EE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2306B6D4&color_dots=%230F172A,%231E3A8A,%230284C7,%2338BDF8,%2322D3EE

      - name: Deploy Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
